name: Finish native polish once

on:
  push:
    branches:
      - portfolio/live-baseline-v1
    paths:
      - .github/workflows/finish-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/live-baseline-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refine AEGIS evidence plate
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/projects/project-visual.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''function AegisVisual({ compact }: { compact?: boolean }) {
            return (
              <Frame
                label="Project-authored AEGIS architecture · deterministic evidence pipeline"
                className="visual-aegis"
                compact={compact}
              >
                <div className="bg-white p-4 sm:p-6">
                  <img
                    src={sitePath("/assets/project/aegis-architecture.svg")}
                    alt="AEGIS architecture from controlled libraries through monitoring, trusted identity, retained versions, format-aware parsing, deterministic diffing, governance, FastAPI, and the React and Tauri desktop interface."
                    loading={compact ? "lazy" : "eager"}
                    className="w-full object-contain"
                  />
                </div>
              </Frame>
            );
          }
          '''
          new = '''function AegisVisual({ compact }: { compact?: boolean }) {
            return (
              <Frame
                label="Project-authored AEGIS architecture · deterministic evidence pipeline"
                className="visual-aegis"
                compact={compact}
              >
                <div className="grid min-h-[24rem] place-items-center bg-cola p-4 sm:p-7 lg:p-10">
                  <div className="paper-card relative w-full rotate-[0.35deg] p-3 sm:p-5">
                    <span className="regmark right-3 top-3" aria-hidden="true" />
                    <img
                      src={sitePath("/assets/project/aegis-architecture.svg")}
                      alt="AEGIS architecture from controlled libraries through monitoring, trusted identity, retained versions, format-aware parsing, deterministic diffing, governance, FastAPI, and the React and Tauri desktop interface."
                      loading={compact ? "lazy" : "eager"}
                      className="w-full object-contain"
                    />
                    <p className="meta mt-3 border-t border-blackcherry/20 pt-3 text-blackcherry/70">
                      System architecture · deterministic evidence before governance
                    </p>
                  </div>
                </div>
              </Frame>
            );
          }
          '''
          if old not in text:
              raise SystemExit("AEGIS visual anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - run: npm ci
      - name: Format touched files
        run: npx prettier --write src/components/projects/project-visual.tsx src/components/site/archive.tsx src/components/site/current-desk.tsx src/components/site/relic.tsx src/components/site/resumes.tsx src/components/site/site-nav.tsx src/routes/contact.tsx src/routes/__root.tsx scripts/validate-content.mjs
      - name: Validate
        run: |
          npm run validate
          npm run build
          npm run typecheck
          npm run lint
          GITHUB_PAGES=true npm run build
      - name: Commit polish
        run: |
          git config user.name "glitchmatrix-jpg"
          git config user.email "extraextra335@gmail.com"
          git add src scripts/validate-content.mjs
          git commit -m "polish: finish native portfolio refinement"
          git push origin HEAD:portfolio/live-baseline-v1
