name: Complete live baseline upgrade once

on:
  push:
    branches:
      - portfolio/live-baseline-v1
    paths:
      - scripts/complete-live-baseline-upgrade.py
      - scripts/validate-content.mjs
      - .github/workflows/live-baseline-upgrade-once.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/live-baseline-v1
          fetch-depth: 0

      - name: Bring verified resume PDFs forward
        run: |
          git fetch origin portfolio/recruiter-polish-v1
          git checkout origin/portfolio/recruiter-polish-v1 -- public/resumes

      - name: Add real AEGIS architecture asset
        run: |
          mkdir -p public/assets/project
          curl --fail --location --retry 3 https://raw.githubusercontent.com/glitchmatrix-jpg/AEGIS/main/docs/assets/architecture.svg --output public/assets/project/aegis-architecture.svg

      - name: Apply native content migration
        run: python scripts/complete-live-baseline-upgrade.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and format touched files
        run: |
          npm ci
          npx prettier --write src/components/site/resumes.tsx src/components/site/current-desk.tsx src/components/site/selected-work-index.tsx src/components/site/archive.tsx src/components/site/hero.tsx src/routes/about.tsx src/routes/build/aegis.tsx src/content/site.ts src/content/portfolio.ts src/components/projects/project-visual.tsx scripts/validate-content.mjs

      - name: Validate build
        run: |
          npm run validate
          npm run build
          npm run typecheck
          npm run lint

      - name: Commit native upgrade
        run: |
          git config user.name "glitchmatrix-jpg"
          git config user.email "extraextra335@gmail.com"
          git add public/resumes public/assets/project/aegis-architecture.svg src scripts/validate-content.mjs
          git commit -m "feat: complete native AEGIS and resume upgrade"
          git push origin HEAD:portfolio/live-baseline-v1
