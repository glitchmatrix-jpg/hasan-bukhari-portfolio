name: Live baseline CI

on:
  push:
    branches:
      - portfolio/live-baseline-v1
  pull_request:
    branches:
      - design/homepage-refinement

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Validate GitHub Pages build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
