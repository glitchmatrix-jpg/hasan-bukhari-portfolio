name: NPM audit once

on:
  push:
    branches: [portfolio/recruiter-polish-v1]
    paths:
      - .github/workflows/npm-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/recruiter-polish-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev || true
      - name: Full dependency audit
        run: npm audit || true
