name: Next patch once

on:
  push:
    branches: [portfolio/recruiter-polish-v1]
    paths:
      - .github/workflows/next-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/recruiter-polish-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update stable Next patch line
        run: npm install --save-exact next@16.2.12 @next/mdx@16.2.12 eslint-config-next@16.2.12
      - run: npm run validate
      - run: npm run release:gate
      - run: npm run build
      - name: Report production audit after patch
        run: npm audit --omit=dev || true
      - run: |
          git config user.name "glitchmatrix-jpg"
          git config user.email "extraextra335@gmail.com"
          git add package.json package-lock.json
          git commit -m "chore: update Next.js stable patch line to 16.2.12"
          git push origin HEAD:portfolio/recruiter-polish-v1
