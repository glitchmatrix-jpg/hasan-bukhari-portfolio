name: Recruiter homepage tier v2

on:
  push:
    branches: [portfolio/recruiter-polish-v1]
    paths:
      - .github/workflows/recruiter-homepage-tier-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/recruiter-polish-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_one_shot_homepage_tier.py
      - run: |
          git config user.name "glitchmatrix-jpg"
          git config user.email "extraextra335@gmail.com"
          git add src/app/page.tsx src/app/home.module.css
          git commit -m "feat: add selected deeper work homepage tier"
          git push origin HEAD:portfolio/recruiter-polish-v1
