name: Recruiter format once

on:
  push:
    branches: [portfolio/recruiter-polish-v1]
    paths:
      - .github/workflows/recruiter-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/recruiter-polish-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:write
      - run: |
          git config user.name "glitchmatrix-jpg"
          git config user.email "extraextra335@gmail.com"
          git add -A
          git commit -m "style: format recruiter polish changes"
          git push origin HEAD:portfolio/recruiter-polish-v1
