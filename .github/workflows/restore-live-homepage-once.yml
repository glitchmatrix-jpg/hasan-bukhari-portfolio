name: Restore live homepage once

on:
  push:
    branches: [portfolio/recruiter-polish-v1]
    paths:
      - .github/workflows/restore-live-homepage-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/recruiter-polish-v1
          fetch-depth: 0
      - name: Restore homepage from develop and apply copy-only cleanup
        run: |
          git fetch origin develop
          git checkout origin/develop -- src/app/page.tsx src/app/home.module.css
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/page.tsx')
          s = page.read_text(encoding='utf-8')
          replacements = {
              'RÃ©sumÃ©s': 'Résumés',
              'rÃ©sumÃ©s': 'résumés',
              'â€”': '—',
              'Â·': '·',
              'â†’': '→',
              'commitmentsâ€”': 'commitments—',
              'Recovery dashboard asset pending': 'Offline recovery dashboard study',
              'Synthetic-data screenshot pending': 'Nutrition dashboard study · synthetic demo data',
              'Public-safe placeholder for the Taaqat recovery dashboard': 'Public-safe study of the Taaqat recovery dashboard',
              'Public-safe placeholder for the Nivala nutrition dashboard': 'Public-safe study of the Nivala nutrition dashboard',
              'Abstract public-safe placeholder for the HEARTLINE mobile interface': 'Abstract public-safe study representing the HEARTLINE mobile interface',
              'Abstract blue book-cover placeholder for Flooded': 'Abstract public-safe book-cover study for Flooded',
              'Event photograph placeholder pending photographer and participant rights review': 'Public-safe community study; participant imagery withheld',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          page.write_text(s, encoding='utf-8')

          css = Path('src/app/home.module.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace('PUBLIC-SAFE VISUAL / FINAL ASSET PENDING', 'PUBLIC-SAFE VISUAL STUDY')
          c = c.replace('ORIGINAL EVENT PHOTOGRAPH PENDING RIGHTS REVIEW', 'COMMUNITY / PUBLIC-SAFE STUDY')
          css.write_text(c, encoding='utf-8')
          PY
      - name: Commit exact visual reset
        run: |
          git config user.name "glitchmatrix-jpg"
          git config user.email "extraextra335@gmail.com"
          git add src/app/page.tsx src/app/home.module.css
          git commit -m "fix: restore live homepage visual system"
          git push origin HEAD:portfolio/recruiter-polish-v1
