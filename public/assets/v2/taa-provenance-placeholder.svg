<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">To Ash Again evidence placeholder</title>
  <desc id="description">A red and black atmospheric frame marking that recovered game art requires provenance approval.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070606" />
      <stop offset="0.58" stop-color="#27080f" />
      <stop offset="1" stop-color="#760d20" />
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#d7c7b8" />
      <stop offset="0.7" stop-color="#a20f24" />
      <stop offset="1" stop-color="#a20f24" stop-opacity="0" />
    </radialGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#eee8dc" opacity="0.13" />
      <circle cx="7" cy="5" r="0.55" fill="#eee8dc" opacity="0.08" />
    </pattern>
  </defs>
  <rect width="1440" height="760" fill="url(#sky)" />
  <circle cx="1110" cy="205" r="185" fill="url(#moon)" opacity="0.8" />
  <path d="M0 470 150 390 300 455 460 320 610 435 770 350 930 460 1110 325 1260 400 1440 340V760H0Z" fill="#11090b" />
  <path d="M0 570 210 485 360 560 540 455 700 540 850 465 1040 560 1210 470 1440 525V760H0Z" fill="#080707" />
  <rect width="1440" height="760" fill="url(#grain)" />
  <g fill="#eee8dc">
    <text x="70" y="88" font-family="Consolas, monospace" font-size="19" letter-spacing="4">RECOVERED GAME ART LOCATED</text>
    <text x="70" y="122" font-family="Consolas, monospace" font-size="15" letter-spacing="3" opacity="0.7">PROVENANCE APPROVAL REQUIRED BEFORE PUBLICATION</text>
  </g>
  <g transform="translate(1010 475)" fill="#eee8dc">
    <rect x="0" y="0" width="18" height="88" />
    <rect x="-22" y="20" width="62" height="18" />
    <circle cx="9" cy="-18" r="21" />
    <path d="M-6 83-42 148h30L9 111l22 37h31L24 83Z" />
  </g>
