<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AEGIS 1.0 architecture</title>
  <desc id="desc">Controlled documents flow through AEGIS Watch, identity and version storage, deterministic parser and diff, SQLite, FastAPI Core, and the Tauri desktop application.</desc>
  <rect width="1200" height="720" fill="#F7FDF5"/>
  <style>
    .box{fill:#fff;stroke:#D6E0D3;stroke-width:2;rx:18}.core{fill:#EAF8F0;stroke:#1BB472}.title{font:700 24px Arial,sans-serif;fill:#191B17}.label{font:700 17px Arial,sans-serif;fill:#191B17}.sub{font:14px Arial,sans-serif;fill:#516358}.arrow{stroke:#07713A;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#07713A"/></marker></defs>
  <text x="60" y="62" class="title">AEGIS — Controlled Document Intelligence &amp; Governance</text>
  <rect class="box" x="60" y="120" width="230" height="100"/><text class="label" x="85" y="157">Controlled Libraries</text><text class="sub" x="85" y="184">Local folders · network shares</text>
  <rect class="box core" x="350" y="120" width="220" height="100"/><text class="label" x="400" y="157">AEGIS Watch</text><text class="sub" x="375" y="184">Realtime + reconciliation</text>
  <rect class="box" x="630" y="120" width="220" height="100"/><text class="label" x="666" y="157">Identity + SHA-256</text><text class="sub" x="664" y="184">Trusted document state</text>
  <rect class="box" x="910" y="120" width="230" height="100"/><text class="label" x="955" y="157">Version Store</text><text class="sub" x="938" y="184">Verified original DOCX</text>
  <path class="arrow" d="M290 170 H340"/><path class="arrow" d="M570 170 H620"/><path class="arrow" d="M850 170 H900"/>
  <rect class="box core" x="210" y="300" width="250" height="110"/><text class="label" x="254" y="338">OOXML Parser</text><text class="sub" x="246" y="365">Semantic structured snapshot</text><text class="sub" x="254" y="387">clauses · tables · metadata</text>
  <rect class="box core" x="520" y="300" width="250" height="110"/><text class="label" x="566" y="338">AEGIS Diff</text><text class="sub" x="554" y="365">Deterministic exact evidence</text><text class="sub" x="578" y="387">add · remove · replace</text>
  <rect class="box" x="830" y="300" width="250" height="110"/><text class="label" x="903" y="338">SQLite</text><text class="sub" x="858" y="365">Metadata · workflow · audit</text><text class="sub" x="870" y="387">risk · search · analytics</text>
  <path class="arrow" d="M1025 220 V260 H335 V290"/><path class="arrow" d="M460 355 H510"/><path class="arrow" d="M770 355 H820"/>
  <rect class="box core" x="275" y="500" width="280" height="120"/><text class="label" x="340" y="540">FastAPI AEGIS Core</text><text class="sub" x="321" y="568">Monitoring · Governance · Search</text><text class="sub" x="352" y="592">Intelligence · Backup</text>
  <rect class="box core" x="650" y="500" width="280" height="120"/><text class="label" x="712" y="540">Tauri Desktop</text><text class="sub" x="688" y="568">React + TypeScript user interface</text><text class="sub" x="690" y="592">One Windows application</text>
  <path class="arrow" d="M955 410 V455 H415 V490"/><path class="arrow" d="M555 560 H640"/>
</svg>
